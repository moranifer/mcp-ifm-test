name: Build test APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MCP-ifm-Test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MCP-ifm-Test
          path: MCP-ifm-Test.apk

      - name: Publish for phone download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          name: MCP-ifm Test build ${{ github.run_number }}
          files: MCP-ifm-Test.apk
          make_latest: true
