plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mcpifm.test'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mcpifm.test'
        minSdk 29
        targetSdk 33
        versionCode 1
        versionName '0.1-feasibility'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
